[project]
name = "reconciliation"
version = "0.1.0"
description = "Money reconciliation demo: ledger, payment platform, payouts and bank, in dbt and DuckDB"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dbt-core>=1.11,<1.13",
    "dbt-duckdb==1.11.0",
    "duckdb==1.5.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
