unit_tests:
  - name: matches_counterexample_100_100_vs_100_90
    description: >
      Founder's counterexample (review 14 Oct): ledger [100, 100], platform [100, 90] is one
      amount_mismatch of -10, not a duplicate plus a missing line.
    model: matches
    given:
      - input: ref('ledger_lines')
        rows:
          - {dataset: t, entry_id: L1, key: A, kind: sale, amount: 100.00, currency: EUR, booked_on: 2026-09-10}
          - {dataset: t, entry_id: L2, key: A, kind: sale, amount: 100.00, currency: EUR, booked_on: 2026-09-10}
      - input: ref('platform_lines')
        rows:
          - {dataset: t, line_id: P1, payout_id: po_1, key: A, kind: sale, amount: 100.00, currency: EUR, occurred_on: 2026-09-10, customer_currency: EUR}
          - {dataset: t, line_id: P2, payout_id: po_1, key: A, kind: sale, amount: 90.00, currency: EUR, occurred_on: 2026-09-10, customer_currency: EUR}
    expect:
      rows:
        - {key: A, kind: sale, cause: amount_mismatch, difference: -10.00}

  - name: matches_rules_of_the_spec
    model: matches
    given:
      - input: ref('ledger_lines')
        rows:
          - {dataset: t, entry_id: L1, key: DUP, kind: sale, amount: 50.00, currency: EUR, booked_on: 2026-09-01}
          - {dataset: t, entry_id: L2, key: DUP, kind: sale, amount: 50.00, currency: EUR, booked_on: 2026-09-01}
          - {dataset: t, entry_id: L3, key: TWO, kind: sale, amount: 500.00, currency: EUR, booked_on: 2026-09-02}
          - {dataset: t, entry_id: L4, key: TWO, kind: sale, amount: 500.00, currency: EUR, booked_on: 2026-09-02}
          - {dataset: t, entry_id: L5, key: SPLIT, kind: sale, amount: 60.00, currency: EUR, booked_on: 2026-09-03}
          - {dataset: t, entry_id: L6, key: SPLIT, kind: sale, amount: 40.00, currency: EUR, booked_on: 2026-09-03}
          - {dataset: t, entry_id: L7, key: ONLYL, kind: sale, amount: 70.00, currency: EUR, booked_on: 2026-09-04}
          - {dataset: t, entry_id: L8, key: PART, kind: refund, amount: -100.00, currency: EUR, booked_on: 2026-09-05}
          - {dataset: t, entry_id: L9, key: FEEHI, kind: fee, amount: -75.00, currency: RUB, booked_on: 2026-09-06}
          - {dataset: t, entry_id: L10, key: FX, kind: sale, amount: 93.71, currency: EUR, booked_on: 2026-09-07}
          - {dataset: t, entry_id: L11, key: EDIT, kind: sale, amount: 192.00, currency: EUR, booked_on: 2026-09-08}
      - input: ref('platform_lines')
        rows:
          - {dataset: t, line_id: P1, payout_id: po_1, key: DUP, kind: sale, amount: 50.00, currency: EUR, occurred_on: 2026-09-01, customer_currency: EUR}
          - {dataset: t, line_id: P2, payout_id: po_1, key: TWO, kind: sale, amount: 500.00, currency: EUR, occurred_on: 2026-09-02, customer_currency: EUR}
          - {dataset: t, line_id: P3, payout_id: po_1, key: TWO, kind: sale, amount: 500.00, currency: EUR, occurred_on: 2026-09-02, customer_currency: EUR}
          - {dataset: t, line_id: P4, payout_id: po_1, key: SPLIT, kind: sale, amount: 100.00, currency: EUR, occurred_on: 2026-09-03, customer_currency: EUR}
          - {dataset: t, line_id: P5, payout_id: po_1, key: PART, kind: refund, amount: -30.00, currency: EUR, occurred_on: 2026-09-05, customer_currency: EUR}
          - {dataset: t, line_id: P6, payout_id: po_1, key: FEEHI, kind: fee, amount: -85.00, currency: RUB, occurred_on: 2026-09-06, customer_currency: RUB}
          - {dataset: t, line_id: P7, payout_id: po_1, key: NOFEE, kind: fee, amount: -2.15, currency: EUR, occurred_on: 2026-09-06, customer_currency: EUR}
          - {dataset: t, line_id: P8, payout_id: po_1, key: du_1, kind: charge, amount: -115.00, currency: EUR, occurred_on: 2026-09-06, customer_currency: EUR}
          - {dataset: t, line_id: P9, payout_id: po_1, key: ONLYP, kind: sale, amount: 80.00, currency: EUR, occurred_on: 2026-09-06, customer_currency: EUR}
          - {dataset: t, line_id: P10, payout_id: po_1, key: FX, kind: sale, amount: 91.87, currency: EUR, occurred_on: 2026-09-07, customer_currency: USD}
          - {dataset: t, line_id: P11, payout_id: po_1, key: EDIT, kind: sale, amount: 129.00, currency: EUR, occurred_on: 2026-09-08, customer_currency: EUR}
    expect:
      rows:
        - {key: DUP, kind: sale, cause: duplicate, difference: -50.00}
        - {key: TWO, kind: sale, cause: null, difference: 0.00}
        - {key: SPLIT, kind: sale, cause: null, difference: 0.00}
        - {key: ONLYL, kind: sale, cause: missing_at_platform, difference: -70.00}
        - {key: PART, kind: refund, cause: partial, difference: 70.00}
        - {key: FEEHI, kind: fee, cause: fee, difference: -10.00}
        - {key: NOFEE, kind: fee, cause: fee, difference: -2.15}
        - {key: du_1, kind: charge, cause: unbooked, difference: -115.00}
        - {key: ONLYP, kind: sale, cause: missing_in_ledger, difference: 80.00}
        - {key: FX, kind: sale, cause: fx, difference: -1.84}
        - {key: EDIT, kind: sale, cause: amount_mismatch, difference: -63.00}
  - name: bank_matches_rules
    description: >
      Reference match (po_ok), reference match with another amount (po_mismatch), unique amount match in
      the window (P-uniq), two payouts with one amount in the window (P-amb1, P-amb2), no deposit
      (P-miss), September payout booked in October (P-oct), deposit with no payout (BK-x).
    model: bank_matches
    overrides:
      vars: {period_start: '2026-09-01', period_end: '2026-09-30', statement_end: '2026-10-07'}
    given:
      - input: ref('payout_checks')
        rows:
          - {dataset: t, payout_id: po_ok, paid_on: 2026-09-03, amount_payout: 100.00, amount_lines: 100.00, difference: 0.00}
          - {dataset: t, payout_id: po_mismatch, paid_on: 2026-09-04, amount_payout: 200.00, amount_lines: 200.00, difference: 0.00}
          - {dataset: t, payout_id: P-uniq, paid_on: 2026-09-10, amount_payout: 300.00, amount_lines: 300.00, difference: 0.00}
          - {dataset: t, payout_id: P-amb1, paid_on: 2026-09-15, amount_payout: 400.00, amount_lines: 400.00, difference: 0.00}
          - {dataset: t, payout_id: P-amb2, paid_on: 2026-09-16, amount_payout: 400.00, amount_lines: 400.00, difference: 0.00}
          - {dataset: t, payout_id: P-miss, paid_on: 2026-09-20, amount_payout: 500.00, amount_lines: 500.00, difference: 0.00}
          - {dataset: t, payout_id: P-oct, paid_on: 2026-10-01, amount_payout: 600.00, amount_lines: 600.00, difference: 0.00}
      - input: ref('payouts')
        rows: []
      - input: ref('deposits')
        rows:
          - {dataset: t, deposit_id: BK-ok, booked_on: 2026-09-04, amount: 100.00, currency: EUR, reference: STRIPE PAYOUT po_ok}
          - {dataset: t, deposit_id: BK-mm, booked_on: 2026-09-05, amount: 199.00, currency: EUR, reference: STRIPE PAYOUT po_mismatch}
          - {dataset: t, deposit_id: BK-uniq, booked_on: 2026-09-11, amount: 300.00, currency: EUR, reference: transfer}
          - {dataset: t, deposit_id: BK-amb, booked_on: 2026-09-17, amount: 400.00, currency: EUR, reference: transfer}
          - {dataset: t, deposit_id: BK-oct, booked_on: 2026-10-02, amount: 600.00, currency: EUR, reference: transfer}
          - {dataset: t, deposit_id: BK-x, booked_on: 2026-09-25, amount: 77.00, currency: EUR, reference: transfer}
    expect:
      rows:
        - {key: po_ok, cause: null, difference: 0.00}
        - {key: po_mismatch, cause: amount_mismatch, difference: -1.00}
        - {key: P-uniq, cause: null, difference: 0.00}
        - {key: P-amb1, cause: ambiguous_deposit, difference: -400.00}
        - {key: P-amb2, cause: ambiguous_deposit, difference: -400.00}
        - {key: BK-amb, cause: ambiguous_deposit, difference: 400.00}
        - {key: P-miss, cause: missing_deposit, difference: -500.00}
        - {key: P-oct, cause: in_transit, difference: -600.00}
        - {key: BK-x, cause: unexpected_deposit, difference: 77.00}
  - name: discrepancies_explain_a_transposition_as_a_hypothesis
    model: discrepancies
    given:
      - input: ref('matches')
        rows:
          - {dataset: t, key: EDIT, kind: sale, amount_ledger: 192.00, amount_platform: 129.00, rest_ledger: 192.00, rest_platform: 129.00, difference: -63.00, cause: amount_mismatch}
          - {dataset: t, key: OK, kind: sale, amount_ledger: 10.00, amount_platform: 10.00, rest_ledger: 0.00, rest_platform: 0.00, difference: 0.00, cause: null}
          - {dataset: t, key: du_won, kind: charge, amount_ledger: 0.00, amount_platform: 30.85, rest_ledger: 0.00, rest_platform: 30.85, difference: 30.85, cause: unbooked}
          - {dataset: t, key: du_lost, kind: charge, amount_ledger: 0.00, amount_platform: -45.85, rest_ledger: 0.00, rest_platform: -45.85, difference: -45.85, cause: unbooked}
      - input: ref('payout_checks')
        rows: []
      - input: ref('bank_matches')
        rows:
          - {dataset: t, key: po_9, amount_payout: 600.00, amount_bank: 600.00, booked_on: 2026-10-01, cause: in_transit, difference: -600.00}
          - {dataset: t, key: po_8, amount_payout: 500.00, amount_bank: 500.00, booked_on: 2026-09-01, cause: in_transit, difference: 500.00}
    expect:
      rows:
        - {discrepancy_id: "t|operation|amount_mismatch|EDIT|sale", effect: short, explanation: "Amounts differ; no other cause found. Digits transposed: likely a manual edit."}
        - {discrepancy_id: "t|bank|in_transit|po_9|payout", effect: timing, explanation: "Payout for operations of this period, booked by the bank after the period end."}
        - {discrepancy_id: "t|bank|in_transit|po_8|payout", effect: timing, explanation: "Payout for operations of an earlier period, booked by the bank in this one."}
        - {discrepancy_id: "t|operation|unbooked|du_won|charge", effect: over, explanation: "Platform returned money it had taken; not booked in the ledger."}
        - {discrepancy_id: "t|operation|unbooked|du_lost|charge", effect: short, explanation: "Platform charge not booked in the ledger."}

  - name: bank_matches_does_not_match_an_id_prefix
    model: bank_matches
    overrides:
      vars: {period_start: '2026-09-01', period_end: '2026-09-30', statement_end: '2026-10-07'}
    given:
      - input: ref('payout_checks')
        rows:
          - {dataset: t, payout_id: po_1, paid_on: 2026-09-03, amount_payout: 100.00, amount_lines: 100.00, difference: 0.00}
          - {dataset: t, payout_id: po_10, paid_on: 2026-09-03, amount_payout: 200.00, amount_lines: 200.00, difference: 0.00}
      - input: ref('payouts')
        rows: []
      - input: ref('deposits')
        rows:
          - {dataset: t, deposit_id: BK-10, booked_on: 2026-09-04, amount: 200.00, currency: EUR, reference: STRIPE PAYOUT po_10}
    expect:
      rows:
        - {key: po_1, cause: missing_deposit, difference: -100.00}
        - {key: po_10, cause: null, difference: 0.00}

  - name: bank_matches_reference_ambiguity
    description: Duplicate references and a reference with two payout IDs must not fall back to amount matching.
    model: bank_matches
    overrides:
      vars: {period_start: '2026-09-01', period_end: '2026-09-30', statement_end: '2026-10-07'}
    given:
      - input: ref('payout_checks')
        rows:
          - {dataset: t, payout_id: po_dup, paid_on: 2026-09-03, amount_payout: 100.00, amount_lines: 100.00, difference: 0.00}
          - {dataset: t, payout_id: po_left, paid_on: 2026-09-10, amount_payout: 200.00, amount_lines: 200.00, difference: 0.00}
          - {dataset: t, payout_id: po_right, paid_on: 2026-09-10, amount_payout: 300.00, amount_lines: 300.00, difference: 0.00}
      - input: ref('payouts')
        rows: []
      - input: ref('deposits')
        rows:
          - {dataset: t, deposit_id: BK-dup1, booked_on: 2026-09-04, amount: 100.00, currency: EUR, reference: STRIPE PAYOUT po_dup}
          - {dataset: t, deposit_id: BK-dup2, booked_on: 2026-09-05, amount: 99.00, currency: EUR, reference: STRIPE PAYOUT po_dup}
          - {dataset: t, deposit_id: BK-multi, booked_on: 2026-09-11, amount: 200.00, currency: EUR, reference: payouts po_left and po_right}
    expect:
      rows:
        - {key: po_dup, cause: ambiguous_deposit, difference: -100.00}
        - {key: po_left, cause: ambiguous_deposit, difference: -200.00}
        - {key: po_right, cause: ambiguous_deposit, difference: -300.00}
        - {key: BK-dup1, cause: ambiguous_deposit, difference: 100.00}
        - {key: BK-dup2, cause: ambiguous_deposit, difference: 99.00}
        - {key: BK-multi, cause: ambiguous_deposit, difference: 200.00}

  - name: matches_paired_fx_does_not_label_domestic_remainder
    model: matches
    given:
      - input: ref('ledger_lines')
        rows:
          - {dataset: t, entry_id: L1, key: A, kind: sale, amount: 100.00, currency: EUR, booked_on: 2026-09-10}
          - {dataset: t, entry_id: L2, key: A, kind: sale, amount: 50.00, currency: EUR, booked_on: 2026-09-10}
      - input: ref('platform_lines')
        rows:
          - {dataset: t, line_id: P1, payout_id: po_1, key: A, kind: sale, amount: 100.00, currency: EUR, occurred_on: 2026-09-10, customer_currency: USD}
          - {dataset: t, line_id: P2, payout_id: po_1, key: A, kind: sale, amount: 40.00, currency: EUR, occurred_on: 2026-09-10, customer_currency: EUR}
    expect:
      rows:
        - {key: A, kind: sale, rest_ledger: 50.00, rest_platform: 40.00, cause: amount_mismatch, difference: -10.00}

  - name: matches_foreign_refund_at_a_new_rate_is_fx
    description: >
      Demo 1, October: a USD charge refunded a month later. The platform converts the dollars at the refund
      day's rate and takes back less than the books reversed; that is a rate, not a partial refund.
    model: matches
    given:
      - input: ref('ledger_lines')
        rows:
          - {dataset: t, entry_id: L1, key: USD, kind: refund, amount: -100.00, currency: EUR, booked_on: 2026-10-06}
          - {dataset: t, entry_id: L2, key: EUR, kind: refund, amount: -100.00, currency: EUR, booked_on: 2026-10-06}
      - input: ref('platform_lines')
        rows:
          - {dataset: t, line_id: P1, payout_id: po_1, key: USD, kind: refund, amount: -98.32, currency: EUR, occurred_on: 2026-10-06, customer_currency: USD}
          - {dataset: t, line_id: P2, payout_id: po_1, key: EUR, kind: refund, amount: -40.00, currency: EUR, occurred_on: 2026-10-06, customer_currency: EUR}
    expect:
      rows:
        - {key: USD, kind: refund, cause: fx, difference: 1.68}
        - {key: EUR, kind: refund, cause: partial, difference: 60.00}

  - name: bank_matches_payout_of_an_earlier_period_arriving_now
    description: >
      Demo 1, October: the payout of 30 September reaches the bank on 1 October. It matches its deposit and
      shows as timing with the deposit amount, not as a deposit without a payout. One that arrived before the
      period is not a candidate.
    model: bank_matches
    overrides:
      vars: {period_start: '2026-10-01', period_end: '2026-10-31', statement_end: '2026-11-07'}
    given:
      - input: ref('payout_checks')
        rows:
          - {dataset: t, payout_id: po_oct, paid_on: 2026-10-02, amount_payout: 100.00, amount_lines: 100.00, difference: 0.00}
          - {dataset: t, payout_id: po_end, paid_on: 2026-11-02, amount_payout: 200.00, amount_lines: 200.00, difference: 0.00}
      - input: ref('payouts')
        rows:
          - {dataset: t, payout_id: po_sep, paid_on: 2026-10-01, period_from: 2026-09-30, period_to: 2026-09-30, amount: 600.00, currency: EUR}
          - {dataset: t, payout_id: po_old, paid_on: 2026-09-30, period_from: 2026-09-29, period_to: 2026-09-29, amount: 700.00, currency: EUR}
          - {dataset: t, payout_id: po_oct, paid_on: 2026-10-02, period_from: 2026-10-01, period_to: 2026-10-01, amount: 100.00, currency: EUR}
          - {dataset: t, payout_id: po_end, paid_on: 2026-11-02, period_from: 2026-10-30, period_to: 2026-10-30, amount: 200.00, currency: EUR}
      - input: ref('deposits')
        rows:
          - {dataset: t, deposit_id: BK-sep, booked_on: 2026-10-01, amount: 600.00, currency: EUR, reference: STRIPE PAYOUT po_sep}
          - {dataset: t, deposit_id: BK-oct, booked_on: 2026-10-02, amount: 100.00, currency: EUR, reference: STRIPE PAYOUT po_oct}
          - {dataset: t, deposit_id: BK-end, booked_on: 2026-11-02, amount: 200.00, currency: EUR, reference: STRIPE PAYOUT po_end}
    expect:
      rows:
        - {key: po_sep, cause: in_transit, difference: 600.00}
        - {key: po_oct, cause: null, difference: 0.00}
        - {key: po_end, cause: in_transit, difference: -200.00}

  - name: rollforward_joins_the_opening_list_and_the_period_by_line
    description: >
      Demo 1, October: a line open since September stays (EU-1); a September dispute won in October nets to the
      fee (du_1); a line new in October starts in October (EU-9).
    model: rollforward
    overrides:
      vars: {opening: true, period_start: '2026-10-01', period_end: '2026-10-31', statement_end: '2026-11-07'}
    given:
      - input: ref('stg_opening')
        rows:
          - {dataset: t, key: EU-1, kind: sale, cause: duplicate, difference: -50.00, month: '2026-09'}
          - {dataset: t, key: du_1, kind: charge, cause: unbooked, difference: -45.85, month: '2026-09'}
      - input: ref('discrepancies')
        rows:
          - {dataset: t, level: operation, cause: unbooked, key: du_1, kind: charge, difference: 30.85}
          - {dataset: t, level: operation, cause: fx, key: EU-9, kind: refund, difference: 6.59}
          - {dataset: t, level: bank, cause: in_transit, key: po_1, kind: payout, difference: -3841.55}
    expect:
      rows:
        - {key: EU-1, cause_opening: duplicate, cause_period: null, since: '2026-09', opening: -50.00, period: 0.00, closing: -50.00}
        - {key: du_1, cause_opening: unbooked, cause_period: unbooked, since: '2026-09', opening: -45.85, period: 30.85, closing: -15.00}
        - {key: EU-9, cause_opening: null, cause_period: fx, since: '2026-10', opening: 0.00, period: 6.59, closing: 6.59}
