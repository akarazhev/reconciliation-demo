models:
  - name: stg_wb__report
    columns:
      - name: rrd_id
        data_tests: [unique, not_null]
  - name: stg_wb__lines
    columns:
      - name: line_id
        data_tests: [unique, not_null]
  - name: stg_wb__payouts
    columns:
      - name: payout_id
        data_tests: [unique, not_null]

unit_tests:
  - name: wb_lines_split_a_sale_without_a_second_commission
    description: >
      Review 14 Oct: a sale of 1 000 with 850 for the seller and logistics of 100 gives sale +1000,
      fee -150 and charge -100, a payout of 750; a return withholds the net 850; storage without srid
      is keyed by code and date.
    model: stg_wb__lines
    given:
      - input: ref('stg_wb__report')
        rows:
          - {rrd_id: '1', realizationreport_id: '9', rr_dt: 2026-09-08, srid: S1, supplier_oper_name: Продажа, retail_price_withdisc_rub: 1000.00, ppvz_for_pay: 850.00, delivery_rub: 0.00, storage_fee: 0.00, penalty: 0.00, deduction: 0.00}
          - {rrd_id: '2', realizationreport_id: '9', rr_dt: 2026-09-08, srid: S1, supplier_oper_name: Логистика, retail_price_withdisc_rub: 0.00, ppvz_for_pay: 0.00, delivery_rub: 100.00, storage_fee: 0.00, penalty: 0.00, deduction: 0.00}
          - {rrd_id: '3', realizationreport_id: '9', rr_dt: 2026-09-10, srid: S2, supplier_oper_name: Возврат, retail_price_withdisc_rub: 1000.00, ppvz_for_pay: 850.00, delivery_rub: 0.00, storage_fee: 0.00, penalty: 0.00, deduction: 0.00}
          - {rrd_id: '4', realizationreport_id: '9', rr_dt: 2026-09-13, srid: null, supplier_oper_name: Хранение, retail_price_withdisc_rub: 0.00, ppvz_for_pay: 0.00, delivery_rub: 0.00, storage_fee: 50.00, penalty: 0.00, deduction: 0.00}
      - input: ref('kind_map_wb')
        rows:
          - {supplier_oper_name: Продажа, part: retail, kind: sale, sign: 1, code: sale}
          - {supplier_oper_name: Продажа, part: commission, kind: fee, sign: 1, code: commission}
          - {supplier_oper_name: Возврат, part: net, kind: refund, sign: -1, code: refund}
          - {supplier_oper_name: Логистика, part: delivery, kind: charge, sign: -1, code: logistics}
          - {supplier_oper_name: Хранение, part: storage, kind: charge, sign: -1, code: storage}
    expect:
      rows:
        - {line_id: '1:retail', key: S1, kind: sale, amount: 1000.00}
        - {line_id: '1:commission', key: S1, kind: fee, amount: -150.00}
        - {line_id: '2:delivery', key: S1, kind: charge, amount: -100.00}
        - {line_id: '3:net', key: S2, kind: refund, amount: -850.00}
        - {line_id: '4:storage', key: 'storage:2026-09-13', kind: charge, amount: -50.00}
